<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a6fb8"/>
      <stop offset="100%" style="stop-color:#8ec5fc"/>
    </linearGradient>
    <linearGradient id="icon_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a6fb8"/>
      <stop offset="100%" style="stop-color:#5eb3ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="0" y="0" width="400" height="100" rx="16" ry="16" fill="url(#bg)"/>

  <!-- Icon: stylized chart/book -->
  <g transform="translate(25, 15)">
    <!-- Book/ledger base -->
    <rect x="0" y="8" width="52" height="62" rx="6" ry="6" fill="none" stroke="url(#icon_grad)" stroke-width="2.5"/>
    <line x1="14" y1="8" x2="14" y2="70" stroke="url(#icon_grad)" stroke-width="2" opacity="0.5"/>

    <!-- Bar chart inside -->
    <rect x="22" y="44" width="7" height="18" rx="1.5" fill="#8ec5fc" opacity="0.7"/>
    <rect x="32" y="34" width="7" height="28" rx="1.5" fill="#5eb3ff" opacity="0.85"/>
    <rect x="42" y="24" width="7" height="38" rx="1.5" fill="url(#accent)"/>

    <!-- Trend arrow up -->
    <polyline points="22,42 32,32 42,22" fill="none" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="36,22 42,22 42,28" fill="none" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: Esep -->
  <text x="90" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Esep</text>

  <!-- Text: Online -->
  <text x="209" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="300" fill="url(#accent)" letter-spacing="-0.5">Online</text>

  <!-- Subtitle -->
  <text x="92" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="3" text-transform="uppercase">ОБЛАЧНАЯ БУХГАЛТЕРИЯ</text>

  <!-- Accent line under logo -->
  <rect x="90" y="84" width="80" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>
</svg>