<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8ec5fc"/>
      <stop offset="100%" style="stop-color:#2a6fb8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5eb3ff"/>
      <stop offset="100%" style="stop-color:#1e5290"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Book/ledger outline -->
  <rect x="96" y="76" width="320" height="360" rx="28" ry="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <line x1="160" y1="76" x2="160" y2="436" stroke="rgba(255,255,255,0.1)" stroke-width="5"/>

  <!-- Bar chart -->
  <rect x="192" y="280" width="48" height="120" rx="8" fill="url(#bar1)"/>
  <rect x="260" y="210" width="48" height="190" rx="8" fill="url(#bar2)"/>
  <rect x="328" y="140" width="48" height="260" rx="8" fill="url(#bar3)"/>

  <!-- Trend line -->
  <polyline points="216,265 284,195 352,125" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="352" cy="125" r="10" fill="#ffffff" opacity="0.9"/>

  <!-- Letter E -->
  <text x="108" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="90" font-weight="800" fill="rgba(255,255,255,0.85)" letter-spacing="-2">E</text>
</svg>