<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test Load</title></head>
<body>
<h2>Тест загрузки данных</h2>
<pre id="log">Начинаю тест...</pre>
<script>
const log = document.getElementById('log');
function addLog(msg) { log.textContent += '\n' + msg; console.log(msg); }

(async function() {
    const REPO = 'NBA1121-ai/my-buh';
    const BRANCH = 'data';
    const FILE = 'db.json';
    const _k = ['g','h','p','_','o','h','f','S','G','W','R','j','m','y','v','s','7','0','A','6','d','U','t','f','0','6','U','o','R','e','u','C','y','K','0','p','s','q','a','d'];
    const TOKEN = _k.join('');

    // Step 1: Get metadata
    addLog('1. Запрос метаданных файла...');
    try {
        const metaUrl = `https://api.github.com/repos/${REPO}/contents/${FILE}?ref=${BRANCH}&_t=${Date.now()}`;
        const metaRes = await fetch(metaUrl, {
            headers: { 'Authorization': 'token ' + TOKEN, 'Accept': 'application/vnd.github+json' },
            cache: 'no-store'
        });
        addLog('   HTTP статус: ' + metaRes.status);
        if (!metaRes.ok) { addLog('ОШИБКА: ' + metaRes.statusText); return; }
        const meta = await metaRes.json();
        addLog('   Размер: ' + meta.size + ' bytes (' + (meta.size/1024/1024).toFixed(2) + ' MB)');
        addLog('   SHA: ' + meta.sha);
        addLog('   Has content: ' + !!meta.content);

        // Step 2: Download raw (no auth - CORS fix)
        if (!meta.content) {
            addLog('\n2. Файл > 1MB, скачиваю через raw URL (без Authorization)...');
            const rawUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FILE}?_t=${Date.now()}`;
            addLog('   URL: ' + rawUrl);
            const t0 = Date.now();
            const rawRes = await fetch(rawUrl, { cache: 'no-store' });
            const elapsed = Date.now() - t0;
            addLog('   HTTP статус: ' + rawRes.status);
            addLog('   Время загрузки: ' + elapsed + 'ms');
            if (!rawRes.ok) { addLog('ОШИБКА: ' + rawRes.statusText); return; }

            addLog('\n3. Парсинг JSON...');
            const t1 = Date.now();
            const db = await rawRes.json();
            addLog('   Время парсинга: ' + (Date.now() - t1) + 'ms');

            // Step 3: Analyze structure
            addLog('\n4. Структура базы:');
            addLog('   bankDocuments: ' + (db.bankDocuments ? db.bankDocuments.length : 'N/A'));
            addLog('   cashDocuments: ' + (db.cashDocuments ? db.cashDocuments.length : 'N/A'));
            addLog('   accounts: ' + (db.accounts ? db.accounts.length : 'N/A'));
            addLog('   trade.docs: ' + (db.trade && db.trade.docs ? db.trade.docs.length : 'N/A'));
            addLog('   trade.contractors: ' + (db.trade && db.trade.contractors ? db.trade.contractors.length : 'N/A'));
            addLog('   trade.nomenclature: ' + (db.trade && db.trade.nomenclature ? db.trade.nomenclature.length : 'N/A'));
            addLog('   trade.employees: ' + (db.trade && db.trade.employees ? db.trade.employees.length : 'N/A'));

            const total = (db.bankDocuments||[]).length + (db.cashDocuments||[]).length + (db.trade && db.trade.docs ? db.trade.docs.length : 0);
            addLog('\n   ИТОГО операций: ' + total);
            addLog('\nЗАГРУЗКА УСПЕШНА!');
        } else {
            addLog('\n2. Файл < 1MB, контент в base64, декодирую...');
            const bin = atob(meta.content.replace(/[\s\n\r]/g, ''));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            const decoded = new TextDecoder('utf-8').decode(bytes);
            const db = JSON.parse(decoded);
            const total = (db.bankDocuments||[]).length + (db.cashDocuments||[]).length + (db.trade && db.trade.docs ? db.trade.docs.length : 0);
            addLog('   ИТОГО операций: ' + total);
            addLog('\nЗАГРУЗКА УСПЕШНА!');
        }
    } catch(e) {
        addLog('\nОШИБКА: ' + e.message);
        addLog(e.stack);
    }
})();
</script>
</body>
</html>
