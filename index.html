<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1C Бухгалтерия - Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .login-header {
            background: #1a1a1a;
            color: #fff;
            padding: 30px;
            text-align: center;
        }
        .login-header h1 { font-size: 24px; margin-bottom: 5px; }
        .login-header p { color: #999; font-size: 14px; }
        .login-body { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2a6fb8;
            box-shadow: 0 0 0 3px rgba(42, 111, 184, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2a6fb8;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover { background: #1e5290; }
        .btn-login:disabled { background: #999; cursor: not-allowed; }
        .error-msg {
            background: #fde8e8;
            color: #d32f2f;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
        .footer-text {
            text-align: center;
            padding: 15px 30px 25px;
            font-size: 12px;
            color: #999;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #2a6fb8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>1C Бухгалтерия</h1>
            <p>Облачная система учета</p>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Проверка авторизации...</p>
        </div>

        <div class="login-body" id="authForm" style="display:none">
            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="loginInput" placeholder="Введите логин" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль" autocomplete="current-password">
            </div>

            <button class="btn-login" id="loginBtn" onclick="handleLogin()">Войти</button>
        </div>

        <div class="footer-text">
            Данные хранятся в GitHub с полной историей изменений
        </div>
    </div>

    <script src="js/db-sync.js"></script>
    <script>
        const VALID_USERS = [
            {
                loginHash: '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918',
                passHash: '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9',
                name: 'Администратор'
            }
        ];

        // SHA-256 hash function
        async function sha256(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        DbSync.init();

        // Check if already logged in
        (function() {
            const session = localStorage.getItem('auth_session');
            if (session) {
                try {
                    const s = JSON.parse(session);
                    if (s.authenticated && s.expires > Date.now()) {
                        window.location.href = 'app.html';
                        return;
                    }
                } catch(e) {}
            }
            document.getElementById('loading').style.display = 'none';
            document.getElementById('authForm').style.display = 'block';
        })();

        async function handleLogin() {
            const login = document.getElementById('loginInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value;
            const errEl = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            errEl.style.display = 'none';

            if (!login || !password) {
                errEl.textContent = 'Заполните все поля';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Проверка...';

            const loginH = await sha256(login);
            const passH = await sha256(password);

            const user = VALID_USERS.find(u => u.loginHash === loginH && u.passHash === passH);

            if (!user) {
                errEl.textContent = 'Неверный логин или пароль';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Войти';
                return;
            }

            // Save session (24 hours)
            localStorage.setItem('auth_session', JSON.stringify({
                authenticated: true,
                name: user.name,
                expires: Date.now() + 24 * 60 * 60 * 1000
            }));

            window.location.href = 'app.html';
        }

        document.getElementById('passwordInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('loginInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('passwordInput').focus();
        });
    </script>
</body>
</html>
