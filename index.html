<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1C Бухгалтерия - Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .login-header {
            background: #1a1a1a;
            color: #fff;
            padding: 30px;
            text-align: center;
        }
        .login-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .login-header p {
            color: #999;
            font-size: 14px;
        }
        .login-body {
            padding: 30px;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 25px;
        }
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .tab:hover { color: #333; }
        .tab.active {
            color: #2a6fb8;
            border-bottom-color: #2a6fb8;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2a6fb8;
            box-shadow: 0 0 0 3px rgba(42, 111, 184, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2a6fb8;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover { background: #1e5290; }
        .btn-login:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .error-msg {
            background: #fde8e8;
            color: #d32f2f;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .footer-text {
            text-align: center;
            padding: 15px 30px 25px;
            font-size: 12px;
            color: #999;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #2a6fb8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>1C Бухгалтерия</h1>
            <p>Облачная система учета</p>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Проверка авторизации...</p>
        </div>

        <div class="login-body" id="authForms">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Вход</button>
                <button class="tab" onclick="switchTab('register')">Регистрация</button>
            </div>

            <div class="tab-content active" id="loginTab">
                <div class="error-msg" id="loginError"></div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="user@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" placeholder="Введите пароль" autocomplete="current-password">
                </div>
                <button class="btn-login" id="loginBtn" onclick="handleLogin()">Войти</button>
            </div>

            <div class="tab-content" id="registerTab">
                <div class="error-msg" id="registerError"></div>
                <div class="success-msg" id="registerSuccess"></div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="user@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Пароль (минимум 6 символов)</label>
                    <input type="password" id="regPassword" placeholder="Придумайте пароль" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Повторите пароль</label>
                    <input type="password" id="regPassword2" placeholder="Повторите пароль" autocomplete="new-password">
                </div>
                <button class="btn-login" id="regBtn" onclick="handleRegister()">Зарегистрироваться</button>
            </div>
        </div>

        <div class="footer-text">
            Данные хранятся в облаке с резервным копированием
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if already logged in
        (async function() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('authForms').style.display = 'none';
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'app.html';
                return;
            }
            document.getElementById('loading').style.display = 'none';
            document.getElementById('authForms').style.display = 'block';
        })();

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerTab').classList.add('active');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                errEl.textContent = 'Заполните все поля';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Вход...';
            errEl.style.display = 'none';

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errEl.textContent = error.message === 'Invalid login credentials'
                    ? 'Неверный email или пароль'
                    : error.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Войти';
                return;
            }

            window.location.href = 'app.html';
        }

        async function handleRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;
            const errEl = document.getElementById('registerError');
            const successEl = document.getElementById('registerSuccess');
            const btn = document.getElementById('regBtn');

            errEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!email || !password) {
                errEl.textContent = 'Заполните все поля';
                errEl.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errEl.textContent = 'Пароль должен быть не менее 6 символов';
                errEl.style.display = 'block';
                return;
            }
            if (password !== password2) {
                errEl.textContent = 'Пароли не совпадают';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Регистрация...';

            const { error } = await supabase.auth.signUp({ email, password });

            if (error) {
                errEl.textContent = error.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Зарегистрироваться';
                return;
            }

            successEl.textContent = 'Регистрация успешна! Войдите в систему.';
            successEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Зарегистрироваться';
            setTimeout(() => switchTab('login'), 2000);
        }

        // Enter key support
        document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
        document.getElementById('regPassword2').addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
    </script>
</body>
</html>
