<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; img-src 'self' data:;">
    <title>EsepOnline (ТЕСТ) — Вход</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #2a6fb8;
            --primary-hover: #1e5290;
            --danger: #d32f2f;
            --radius: 6px;
            --radius-lg: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .login-container {
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .login-header {
            background: #1a1a1a;
            color: #fff;
            padding: 30px;
            text-align: center;
        }
        .login-header h1 { font-size: 24px; margin-bottom: 5px; }
        .login-header p { color: #999; font-size: 14px; }
        .login-body { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42, 111, 184, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-login:hover { background: var(--primary-hover); }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { background: #999; cursor: not-allowed; transform: none; }
        .error-msg {
            background: #fde8e8;
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .footer-text {
            text-align: center;
            padding: 15px 30px 25px;
            font-size: 12px;
            color: #999;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading {
            display: block;
            text-align: center;
            padding: 40px;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            user-select: none;
            background: none;
            border: none;
            padding: 4px;
            line-height: 1;
        }
        .password-toggle:hover { opacity: 0.7; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="icon_EsepOnline.svg" alt="EsepOnline" style="width:64px;height:64px;margin-bottom:10px"><h1>EsepOnline (ТЕСТ)</h1>
            <p>Облачная система учета</p>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Проверка авторизации...</p>
        </div>

        <div class="login-body" id="tokenSetup" style="display:none">
            <div class="error-msg" id="tokenError"></div>
            <p style="font-size:13px;color:#555;margin-bottom:15px">Для работы приложения нужен GitHub Personal Access Token с доступом к репозиторию данных.</p>
            <div class="form-group">
                <label for="tokenInput">GitHub Token</label>
                <input type="password" id="tokenInput" placeholder="ghp_... или github_pat_...">
            </div>
            <button class="btn-login" id="tokenBtn" onclick="handleTokenSetup()">Подключить</button>
        </div>

        <div class="login-body" id="authForm" style="display:none">
            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label for="loginInput">Логин</label>
                <input type="text" id="loginInput" placeholder="Введите логин" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="passwordInput">Пароль</label>
                <div style="position:relative">
                    <input type="password" id="passwordInput" placeholder="Введите пароль" autocomplete="current-password">
                    <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Показать пароль">&#128065;</button>
                </div>
            </div>

            <p style="font-size:11px;color:#999;margin-bottom:15px">Минимальная длина пароля — 6 символов</p>
            <button class="btn-login" id="loginBtn" onclick="handleLogin()">Войти</button>
        </div>

        <div class="footer-text">
            Данные хранятся в GitHub с полной историей изменений
        </div>
    </div>

    <script src="js/db-sync.js"></script>
    <script>
        function togglePassword() {
            const p = document.getElementById('passwordInput');
            const btn = document.querySelector('.password-toggle');
            if (p.type === 'password') {
                p.type = 'text';
                btn.innerHTML = '&#128584;';
            } else {
                p.type = 'password';
                btn.innerHTML = '&#128065;';
            }
        }

        // No fallback users — authentication requires GitHub connection
        const FALLBACK_USERS = [];

        let _allUsers = [];

        // SHA-256 hash function
        async function sha256(text) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Check if already logged in, then load users from GitHub
        (async function() {
            await DbSync.init();
            const session = localStorage.getItem('auth_session');
            if (session) {
                try {
                    const s = JSON.parse(session);
                    if (DbSync.verifySession(s)) {
                        window.location.href = 'app.html';
                        return;
                    } else {
                        localStorage.removeItem('auth_session');
                    }
                } catch(e) { localStorage.removeItem('auth_session'); }
            }

            // If no token in localStorage, show token setup form
            if (!DbSync.getToken()) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tokenSetup').style.display = 'block';
                return;
            }

            // Load users from GitHub (no fallback — GitHub required)
            try {
                const ghUsers = await DbSync.loadUsers();
                if (ghUsers && ghUsers.length) {
                    _allUsers = ghUsers;
                } else {
                    _allUsers = [];
                }
            } catch(e) {
                _allUsers = [];
            }

            if (!_allUsers.length) {
                document.getElementById('loading').innerHTML = '<div style="color:#d32f2f;text-align:center;padding:20px;"><b>Нет подключения к серверу</b><br><br>Не удалось загрузить список пользователей.<br>Проверьте интернет-соединение и обновите страницу.</div>';
                return;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('authForm').style.display = 'block';
            document.getElementById('loginInput').focus();
        })();

        async function handleTokenSetup() {
            const token = document.getElementById('tokenInput').value.trim();
            const errEl = document.getElementById('tokenError');
            const btn = document.getElementById('tokenBtn');
            errEl.style.display = 'none';
            if (!token) { errEl.textContent = 'Введите токен'; errEl.style.display = 'block'; return; }
            btn.disabled = true; btn.textContent = 'Проверка...';
            const user = await DbSync.validateToken(token);
            if (!user) {
                errEl.textContent = 'Токен недействителен или не имеет доступа';
                errEl.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Подключить';
                return;
            }
            await DbSync.setToken(token);
            // Now load users and show login form
            try {
                const ghUsers = await DbSync.loadUsers();
                if (ghUsers && ghUsers.length) _allUsers = ghUsers;
                else _allUsers = [];
            } catch(e) { _allUsers = []; }
            document.getElementById('tokenSetup').style.display = 'none';
            document.getElementById('authForm').style.display = 'block';
            document.getElementById('loginInput').focus();
        }

        let _failCount = parseInt(localStorage.getItem('_loginFailCount')) || 0;
        let _lockUntil = parseInt(localStorage.getItem('_loginLockUntil')) || 0;
        // Clear expired lock
        if (_lockUntil && Date.now() >= _lockUntil) {
            _failCount = 0; _lockUntil = 0;
            localStorage.removeItem('_loginFailCount');
            localStorage.removeItem('_loginLockUntil');
        }

        async function handleLogin() {
            const login = document.getElementById('loginInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value;
            const errEl = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            errEl.style.display = 'none';

            if (Date.now() < _lockUntil) {
                const sec = Math.ceil((_lockUntil - Date.now()) / 1000);
                errEl.textContent = 'Слишком много попыток. Подождите ' + sec + ' сек.';
                errEl.style.display = 'block';
                return;
            }

            if (!login || !password) {
                errEl.textContent = 'Заполните все поля';
                errEl.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errEl.textContent = 'Пароль должен быть не менее 6 символов';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Проверка...';

            const loginH = await sha256(login);

            // Support both salted and unsalted password formats
            let user = null;
            for (const u of _allUsers) {
                if (u.login !== loginH) continue;
                const passH = u.salt ? await sha256(u.salt + password) : await sha256(password);
                if (u.pass === passH) { user = u; break; }
            }

            if (!user) {
                _failCount++;
                localStorage.setItem('_loginFailCount', _failCount);
                if (_failCount >= 5) {
                    _lockUntil = Date.now() + 30000;
                    _failCount = 0;
                    localStorage.setItem('_loginLockUntil', _lockUntil);
                    localStorage.setItem('_loginFailCount', 0);
                }
                errEl.textContent = 'Неверный логин или пароль';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Войти';
                return;
            }
            _failCount = 0;

            // Save signed session (24 hours) with role
            const session = DbSync.createSession(user.name, user.role);
            localStorage.setItem('auth_session', JSON.stringify(session));

            window.location.href = 'app.html';
        }

        document.getElementById('passwordInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('loginInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('passwordInput').focus();
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
            navigator.serviceWorker.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'CLEAR_CACHE') {
                    localStorage.removeItem('db_cache');
                    localStorage.removeItem('db_cache_sha');
                    location.reload();
                }
            });
        }
    </script>
</body>
</html>
